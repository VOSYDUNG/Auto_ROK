account_fit_join:
  required_operator_inputs:
    - current_kingdom_or_season
    - alliance_position
    - owned_commanders
    - commander_levels
    - commander_star_levels
    - commander_skill_states
    - commander_expertise_when_visible
    - available_troop_types_and_tiers
  valuable_optional_inputs:
    - commander_equipment
    - formations
    - armaments
    - march_queue_capacity
    - rally_capacity
    - historical_usage
  output_examples:
    - "best currently usable gathering lineup"
    - "best currently usable Barbarian Fort pair"
    - "best complete open-field march(es) without duplicate commanders"
    - "meta upgrade candidates versus current account gaps"
    - "role-inappropriate investments to avoid"

