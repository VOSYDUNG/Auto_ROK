          - Cleopatra VII
          - Ishida Mitsunari
          - Gaius Marius
          - Sarka
          - Wak Chanil Ajaw
          - Tamar
          - Centurion
        rationale: "Useful dedicated gatherers or early/flexible gathering slots; exact resource specialization should be read from current client skills."
    operator_rules:
      - "Do not spend premium universal Legendary Sculptures merely to satisfy a gathering ranking."
      - "For five-march farming, prefer using all viable gathering commanders rather than forcing one pair across every resource."

