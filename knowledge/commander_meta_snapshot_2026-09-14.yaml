        rationale: "Seondeok is repeatedly highlighted as an end-game gathering priority; Constance remains a high-value early/accessible gatherer."
      - tier: A_PLUS
        commanders:
          - Pepin
          - Casimir
          - Matilda of Flanders
          - Joan of Arc
        rationale: "Strong practical gathering value depending on expertise, account stage and secondary utility."
