schema_version: 1
batch_id: operator-training-2026-09-13
status: training

facts:
  - id: ALLIANCE_TERRITORY_RSS_ACCUMULATES
    type: resource
    description: "Alliance territory RSS accumulates over time."
    source: human_training
    status: training

  - id: ALLIANCE_TERRITORY_RSS_FULL_AROUND_24H
    type: temporal
    description: "Operator reports that alliance territory RSS is effectively full around 24 hours, so it should be claimed daily rather than left idle."
    value:
      approximate_hours: 24
    source: human_training
    status: training
    validation_needed:
      - observe claim amount/timer across repeated days
      - confirm whether timing is exact or operationally approximate

  - id: EVENT_PARTICIPATION_DAY_MAY_BE_CLAN_DECIDED
    type: clan
    description: "For some events, the useful participation day is not determined by the event UI alone; the clan may communicate the chosen day through clan mail."
    source: human_training
    status: training

missions:
  - id: DAILY
    description: "Recurring maintenance mission for tasks whose value decays when not handled each day."
    tasks:
      - CLAIM_ALLIANCE_TERRITORY_RSS

  - id: EVENT_COORDINATION
    description: "Read game/event information plus clan communication, persist the selected participation window/day, and schedule the later participation task."
    tasks:
      - INSPECT_EVENT
      - READ_CLAN_EVENT_MAIL
      - EXTRACT_CLAN_SELECTED_DAY
      - SCHEDULE_EVENT_PARTICIPATION

tasks:
  - id: CLAIM_ALLIANCE_TERRITORY_RSS
    mission: DAILY
    status: training
    due_when:
      rule: "last successful claim is old enough that delaying further risks hitting the ~24h full point"
    known_entry_actions:
      - OPEN_ALLIANCE
    completion_when:
      - "claim action has a verified success state"
      - "last_success timestamp is persisted"
    notes:
      - "The business insight is the accumulation/full-time rule; the exact UI path remains to be trained and validated."

  - id: INSPECT_EVENT
    mission: EVENT_COORDINATION
    status: training
    known_entry_actions:
      - OPEN_EVENTS
    outputs:
      - event_name
      - event_date_range
      - available_time_windows
      - countdowns
    notes:
      - "Event UI facts are ephemeral and should carry observed_at/valid_until provenance."

  - id: READ_CLAN_EVENT_MAIL
    mission: EVENT_COORDINATION
    status: training
    known_entry_actions:
      - OPEN_MAIL
    outputs:
      - relevant_clan_message
    notes:
      - "Mail navigation/filtering still requires additional operator training screenshots."

  - id: EXTRACT_CLAN_SELECTED_DAY
    mission: EVENT_COORDINATION
    status: training
    input:
      - relevant_clan_message
    outputs:
      - clan_selected_event_day
    notes:
      - "This is semantic extraction from message content, not visual coordinate reasoning."

  - id: SCHEDULE_EVENT_PARTICIPATION
    mission: EVENT_COORDINATION
    status: training
    input:
      - clan_selected_event_day
      - event_date_range
      - available_time_windows
    outputs:
      - scheduled_participation_task
    notes:
      - "Scheduling logic is an Agentic-OS capability layered above the game's own UI."

runtime_principles:
  - "GPT-OSS selects among tool-exposed actions; it does not invent a gameplay procedure."
  - "Mission/task knowledge persists independently of screen coordinates."
  - "Native shortcuts are preferred when they express the semantic action directly."
  - "Visual grounding resolves only the remaining target-location problem."
  - "Observed event values are facts for that run, not permanent rules."
