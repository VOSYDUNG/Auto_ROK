schema_version: 1
profile_id: rok-client-1366x768-cpu-v1
coordinate_space: client_pixels_reference
reference_client_size: [1366, 768]
aspect_ratio_tolerance: 0.02
processing_backend:
  name: opencv
  device: cpu
  allow_opencl: false
  allow_cuda: false

# These rectangles are processing windows only.  They are relative to the
# current ROK client frame and must never be used as action coordinates.
#
# ocr_scale is how much a region is magnified before Windows.Media.Ocr sees
# it.  It is MEASURED per region, never picked globally, because the two
# effects pull in opposite directions:
#
#   * a region that clips glyph height reads NOTHING until it is magnified
#   * a well-framed region reads correctly at 1 and gets WORSE at 3, because
#     magnifying a wide strip fragments words that were already legible
#
# Calibrated 2026-09-20 against two live 1366x768 frames, one CITY_VIEW and
# one WORLD_MAP_VIEW, scored against operator-read ground truth.
regions:
  signature_canvas:
    rect: [109, 61, 1148, 614]
    purpose: "low-resolution CITY_VIEW/WORLD_MAP_VIEW visual signature"
  top_resource_bar:
    # Right edge pulled in from 1366 to 1340.  The last 26px hold the green
    # "+" button, and including them corrupted the gem counter on EVERY
    # scale: "13,602" came back as 13,602" / 13,602K / 13,6Ch.  Narrowing the
    # box took the strip from 8/10 to 10/10 exact across both frames, which
    # no amount of magnification achieved.
    rect: [0, 0, 1340, 64]
    ocr_scale: 1.0
    purpose: "resource counters and profile identity OCR"
    calibration:
      measured_on: "2026-09-20"
      frames: ["m7-live-20260920/city-01.png", "p3-observe-20260920/frame-01.png"]
      exact_reads: "10/10"
      note: "scale 2 -> 8/10, scale 3 -> 8/10, scale 4 -> 6/10; do not magnify"
  march_queue_indicator:
    rect: [1240, 110, 125, 50]
    ocr_scale: 1.0
    purpose: "template reading for the visible active-march queue indicator"
    calibration:
      measured_on: "2026-09-20"
      exact_reads: "0 elements at scale 1, 2, 3, 4 and 6, on both frames"
      note: >-
        Windows.Media.Ocr never reads this indicator at any magnification.
        That is why harness/queue_indicator.py matches templates instead, at
        0.207 ms.  Kept here so the region stays registered, not because OCR
        is expected to work on it.
  left_quest_panel:
    rect: [0, 64, 190, 470]
    ocr_scale: 1.0
    purpose: "quest and task text OCR"
    calibration:
      measured_on: "2026-09-20"
      exact_reads: "37 elements at scale 1; 34 at scale 2 and 3"
      note: >-
        Reads well unscaled.  Worth knowing: swept as part of a whole CITY
        frame this same panel yields ZERO, and cropped it yields 37.  The
        frame around the text decides whether the text is read at all, which
        is why every sensor takes a region rather than a screenshot.
  map_coordinate_readout:
    # The "#1296 X:1065 Y:587" widget in the top-left corner.  Calibrated
    # 2026-09-20 while diagnosing why a live world-map frame classified as
    # UNKNOWN_STATE: the coordinates were plainly on screen, and a
    # whole-frame OCR sweep did not read them, so the classifier lost its
    # world-map discriminator and refused.
    #
    # Read through this ROI at scale 2 it separates 7/7 stored frames:
    # present on every bare world-map frame, absent in city view, absent
    # behind the troop panel, and absent when the search panel is open -
    # the client replaces the widget with a back arrow. These observations
    # do not cover every foreground panel: the F6 resource-detail frame keeps
    # the widget visible. Canonical foreground suppression must run before
    # using this region as WORLD_MAP_VIEW evidence.
    #
    # Height 36 and scale 2 are both measured.  At height 24 the glyphs clip
    # and only "Y:587" survives; at scale 1 nothing reads; at scale 3 the
    # words fragment and "X:1065" is lost again.
    rect: [160, 0, 185, 36]
    ocr_scale: 2.0
    purpose: "world-map coordinate readout, used as a presence signal"
    calibration:
      measured_on: "2026-09-20"
      exact_reads: "7/7 across world, city, troop panel and search panel frames"
      note: >-
        Presence matters more than the value here.  A classifier that asks
        "are map coordinates visible" is reading a UI fact; one that asks the
        whole frame for text is hoping, and on this client that hope failed.

  # The resource search panel is NOT at a fixed position.  It is centred
  # under whichever category icon is selected, and the icons sit 142px apart.
  # Measured 2026-09-20 on two live frames: with Cropland selected the panel
  # centred on 538, with Logging Camp on 680, and the same Level readout
  # offset (-80, 505, 160, 36) read correctly in both.
  #
  # This is why a single search_level_readout region read nothing: it was
  # calibrated with Cropland selected and the run had selected Logging Camp,
  # so it was looking 142px to the left of the panel.
  #
  # Category centres read off the label bar of a live frame:
  #   Barbarians 396 · Cropland 538 · Logging Camp 680 · Stone 822 · Gold 964
  #
  # Scale 3 measured; at scale 1 only the "Level:" label survives and the
  # digit - the only part that matters - is lost.
  # ONE strip spanning every panel position, rather than five regions.
  # Each OCR call costs about 33ms of fixed overhead regardless of area, so
  # five small regions cost five times as much as one wide one for no gain:
  # the strip reads "Level: 6" under Cropland and "Level: 4" under Logging
  # Camp in a single call, and reads nothing at all on the world map or in
  # the dispatch drawer.
  #
  # Its width is what encodes the geometry: the panel is centred under the
  # SELECTED category icon, the icons sit exactly 142px apart, and the strip
  # covers all five. Measured centres: Barbarians 396, Cropland 538, Logging
  # Camp 680, Stone 822, Gold 964. The same 142px rule is what
  # harness/resource_level_control.py shifts the slider by - if one is ever
  # recalibrated, the other has to move with it.
  search_level_strip:
    rect: [316, 505, 728, 36]
    ocr_scale: 3.0
    purpose: "selected resource level, wherever the search panel is"
    calibration:
      measured_on: "2026-09-20"
      exact_reads: "Level: 6 under Cropland, Level: 4 under Logging Camp"
      note: >-
        Scale 3 measured. At scale 1 only the "Level:" label survives and the
        digit - the only part that matters - is lost.

  search_execution_strip:
    rect: [330, 562, 740, 50]
    ocr_scale: 3.0
    purpose: "Search button label across the five category panel positions"
    calibration:
      measured_on: "2026-09-27"
      frames: ["f6-search-blocker-20260927-01/current.png", "../runtime/gather_resource-47aa1a0f9012e418/observation-65c9a529e01346229f8421c5da3023a6/current.png"]
      exact_reads: "SEARCH at scale 3 on both saved Gold frames; current frame is empty at scale 2"
      note: "Measured native stored-frame replay; ROI and acquisition authority unchanged. Other category positions require validation."

  resource_point_header:
    rect: [720, 249, 100, 25]
    ocr_scale: 2.0
    purpose: "Resource Point label in the visible selected resource detail card"
    calibration:
      measured_on: "2026-09-27"
      frames: ["f6-detail-blocker-20260927-01/current.png"]
      exact_reads: "Resource Point at scale 2, 3 and 4"
      note: "One stored detail-card placement; unseen card positions remain unevidenced."
  resource_point_gather:
    rect: [815, 446, 160, 60]
    ocr_scale: 2.0
    purpose: "Gather button label in the selected resource detail card"
    calibration:
      measured_on: "2026-09-27"
      frames: ["f6-detail-blocker-20260927-01/current.png"]
      exact_reads: "GATHER at scale 2, 3 and 4"

  # The troop dispatch drawer, which slides in from the right.  It carries
  # its OWN queue readout - "Queue 1/5" at a different place from the bare
  # world map's "1/5" - so the world-map queue ROI reads NO_TEXT here and is
  # right to.  Two surfaces, two regions.
  #
  # Registered 2026-09-20 because the classifier reached this state only
  # INTERMITTENTLY: a whole-frame sweep returned 11-13 elements and caught
  # the drawer text on some ticks and not others.  Both regions below read
  # exactly and identically at scale 2, 3 and 4.
  troop_drawer_queue:
    rect: [1270, 124, 96, 22]
    ocr_scale: 3.0
    purpose: "queue counter inside the troop dispatch drawer"
    calibration:
      measured_on: "2026-09-20"
      exact_reads: "Queue 1/5 at scale 2, 3 and 4"
  troop_drawer_button:
    # The New Troop BUTTON only.  Deliberately not the whole drawer: the
    # prompt above it reads "Dispatch a new troop from your city", so a
    # region covering both offers the words "new troop" TWICE and grounding
    # NEW_TROOP becomes ambiguous by construction.  Two candidates is a
    # refusal, which is correct and also useless.
    #
    # Measured 2026-09-20 on a daylight and a night frame: both read exactly
    # ["New", "Troop"] and nothing else.
    rect: [1080, 200, 175, 48]
    ocr_scale: 3.0
    purpose: "the New Troop button label, for grounding CREATE_NEW_TROOP"
    calibration:
      measured_on: "2026-09-20"
      exact_reads: "New Troop, day and night"
  troop_drawer_prompt:
    rect: [1080, 140, 175, 55]
    ocr_scale: 3.0
    purpose: "dispatch prompt, a state anchor rather than an action target"
    calibration:
      measured_on: "2026-09-20"
      exact_reads: "Dispatch a new troop from your city, day and night"

  # The summary line in the New Troop setup.  The native client renders the
  # selected count in a blue/white strip; Windows.Media.Ocr reliably reads
  # the semantic ``Units`` anchor only when this line is isolated from the
  # adjacent Load field.  The count remains visual corroboration and is never
  # fabricated from the OCR label.
  new_troop_units:
    rect: [660, 480, 165, 25]
    ocr_scale: 2.0
    purpose: "New Troop summary Units anchor for setup classification"
    calibration:
      measured_on: "2026-09-27"
      frame: "gather_resource-87d063bc35de06f9/observation-3c9b85d07a4c4a0a896bfca100f91b9e/current.png"
      exact_reads: "Units: at scales 2, 3 and 4; scales 1 reads nothing"
      note: "Native stored-frame replay; crop excludes adjacent Load field"

  center_canvas:
    rect: [190, 64, 1086, 556]
    purpose: "central game scene visual processing"
  bottom_action_bar:
    rect: [900, 620, 466, 148]
    purpose: "navigation/action icon visual processing"
  # Fixed single-line label ROIs.  These are processing windows only, never
  # action coordinates.  RapidOCR's experiment backend consumes them through
  # the same profile so crop provenance cannot drift from the harness map.
  resource_category_barbarians:
    rect: [350, 732, 105, 24]
    ocr_scale: 2.0
    calibration: {frame: "f6-search-blocker-20260927-01/current.png", preprocessing: "light_text_min_bgr", threshold: 85, exact_read: "Barbarians"}
    purpose: "fixed CPU OCR label crop for the Barbarians search category"
  resource_category_cropland:
    rect: [500, 732, 105, 24]
    ocr_scale: 2.0
    calibration: {frame: "f6-search-blocker-20260927-01/current.png", preprocessing: "light_text_min_bgr", threshold: 85, exact_read: "Cropland"}
    purpose: "fixed CPU OCR label crop for the Cropland search category"
  resource_category_logging_camp:
    rect: [625, 732, 125, 24]
    ocr_scale: 2.0
    calibration: {frame: "f6-search-blocker-20260927-01/current.png", preprocessing: "light_text_min_bgr", threshold: 85, exact_read: "Logging Camp"}
    purpose: "fixed CPU OCR label crop for the Logging Camp search category"
  resource_category_stone_deposit:
    rect: [770, 732, 135, 24]
    ocr_scale: 2.0
    calibration: {frame: "f6-search-blocker-20260927-01/current.png", preprocessing: "light_text_min_bgr", threshold: 90, exact_read: "Stone Deposit"}
    purpose: "fixed CPU OCR label crop for the Stone Deposit search category"
  resource_category_gold_deposit:
    rect: [915, 732, 140, 24]
    ocr_scale: 2.0
    calibration: {frame: "f6-search-blocker-20260927-01/current.png", preprocessing: "light_text_min_bgr", threshold: 85, exact_read: "Gold Deposit"}
    purpose: "fixed CPU OCR label crop for the Gold Deposit search category"
  chat_log:
    rect: [0, 650, 320, 118]
    purpose: "chat text excluded from state classification"
