# Training-first mission knowledge schema.
# Human explanations are authoritative for operator policy; official in-game
# documentation is authoritative for game mechanics/capabilities it explicitly states.
# Unknown rules stay unknown until trained or observed.

schema_version: 3

game:
  name: "Rise of Kingdoms"
  reset_timezone: "UTC"
  supported_window_profiles:
    - id: ROK_DAILY_RESET
      reset_at: "00:00"
      display_timezone: "Asia/Ho_Chi_Minh"
      status: training
      source: human_training

knowledge_sources:
  precedence:
    game_mechanics:
      - official_in_game_guide
      - direct_ui_observation
      - repeated_operator_observation
      - human_training
      - derived
    operator_policy:
      - human_training
      - validated_memory
      - derived
  notes:
    - "Source precedence resolves factual/mechanical conflicts; it does not override operator policy."
    - "OCR is an extraction method, not an authority by itself; retain provenance to the underlying source frame."

facts: []
# Structured knowledge extracted from the game or taught by the operator.
# - id: FACT_ID
#   status: training        # training | validated | retired
#   type: temporal          # temporal | resource | account | clan | event | ui | capability | role | other
#   description: "..."
#   value: null
#   source: human_training  # human_training | official_in_game_guide | direct_ui_observation | game_mail | memory | derived
#   extraction: null        # manual | ocr | cv | parser | null
#   observed_at: null
#   valid_until: null
#   evidence_refs: []

missions: []
# User-level objectives. Missions own task lifecycle and scheduling.
# - id: DAILY
#   status: training
#   description: "Daily maintenance mission"
#   activation:
#     type: recurring
#     rule: null
#   tasks: []

# User-trained example shape; exact timing remains unvalidated until confirmed:
# - id: DAILY
#   status: training
#   tasks:
#     - CLAIM_ALLIANCE_TERRITORY_RSS

# Another user-trained pattern:
# EVENT_COORDINATION may inspect clan mail, extract a clan-selected event day,
# persist it as a fact, and schedule a later participation task.

tasks: []
# - id: TASK_ID
#   mission: MISSION_ID
#   status: training
#   description: "..."
#   due_when:
#     facts: []
#     memory: []
#     temporal_rules: []
#   completion_when:
#     observable: []
#     memory: []
#   tools: []
#   allowed_action_ids: []
#   retry_policy:
#     max_attempts: 0
#     reobserve_before_retry: true
#   persistence:
#     idempotency_key: null
#     record_last_success: true

states: []
# - id: CITY
#   description: "..."
#   positive_evidence: []
#   negative_evidence: []
#   min_confidence: 0.90

tools: []
# Tools hide screenshots/coordinates from the local decision model.
# - id: TOOL_ID
#   task: TASK_ID
#   observe_returns:
#     - state
#     - facts
#     - targets
#     - allowed_actions
#     - last_feedback
#   actions:
#     - id: ACTION_ID
#       requires_target: true
#       preconditions: []
#       expected_postconditions: []
#       risk: low

visual_targets: []
# Semantic target definitions. Runtime bboxes are frame-scoped and ephemeral.
# - id: TARGET_ID
#   label: "..."
#   detectors:
#     - template
#     - ocr
#     - color_shape
#     - visual_grounder
#   min_confidence: 0.90
#   expires_on:
#     - ui_transition
#     - scroll
#     - window_resize
#     - new_frame_when_unstable

rules: []
# Cross-task invariants / policies.
# - id: RULE_ID
#   status: training
#   description: "..."
#   source: human_training
#   applies_to_tasks: []
#   preconditions: []
#   allowed_actions: []
#   forbidden_actions: []
#   exceptions: []
#   reputation_risk: none
#   account_risk: none
#   validation:
#     required_successes: 0
#     observed_successes: 0
#     last_validated_at: null

local_decision_model:
  provider: "local-gpt-oss"
  role: "constrained_action_selector"
  receives:
    - mission
    - task
    - state
    - facts
    - last_feedback
    - allowed_actions
  must_not_require:
    - raw_screen_coordinates
    - long_horizon_gameplay_planning
    - visual_spatial_reasoning_for_known_targets
  output:
    - action
    - arguments
  reject_actions_not_in_allowed_actions: true
  rationale_required: false
