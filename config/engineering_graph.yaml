schema_version: 1
graph_id: AUTO_ROK_GATHER_VERTICAL_SLICE
updated_at: "2026-09-15"

principles:
  - deterministic_first
  - fresh_observation_before_verification
  - dispatch_is_not_success
  - unknown_gameplay_policy_is_needs_decision
  - one_canonical_authority_per_responsibility
  - agent_packages_are_subgraphs_not_file_lists

roots:
  - mission_contract
  - live_capture

required_runtime_path:
  - mission_contract
  - mission_compiler
  - live_capture
  - windows_ocr
  - observation_projection
  - ocr_semantics
  - city_world_visual_detector
  - resource_level_control
  - state_classifier
  - gather_fact_extractor
  - troop_selection_policy
  - policy_overlay
  - state_adapter
  - deterministic_selector
  - mission_engine
  - bounded_mission_tool
  - semantic_action_surface
  - screen_mapping
  - interference_guard
  - windows_input
  - post_action_verification
  - mission_store
  - mission_runner
  - gather_cli
  - gather_runtime_evidence

nodes:
  - id: mission_contract
    kind: config
    responsibility: Declares GATHER_RESOURCE states, actions, parameters, preconditions and completion contract.
    authority: canonical
    status: implemented
    path: config/mission_flows.yaml
    evidence:
      - tests/test_mission_loader.py

  - id: mission_compiler
    kind: code
    responsibility: Compiles trained mission YAML into typed runtime transitions without inventing policy.
    authority: canonical
    status: implemented
    path: harness/mission_loader.py
    evidence:
      - tests/test_mission_loader.py
      - tests/test_gather_runtime_contracts.py

  - id: live_capture
    kind: code
    responsibility: Captures one current ROK HWND client frame with identity, geometry and hash provenance.
    authority: canonical
    status: implemented
    path: harness/windows_capture_backend.py
    evidence:
      - docs/WINDOWS_OBSERVATION.md

  - id: windows_ocr
    kind: adapter
    responsibility: Produces Windows.Media.Ocr elements bound to the captured image/hash and client geometry.
    authority: canonical
    status: implemented
    path: scripts/windows_ocr.ps1
    evidence:
      - tests/test_observation_bridge.py

  - id: observation_projection
    kind: code
    responsibility: Rejects stale/cross-frame evidence and projects OCR/capture into Observation plus SceneGraph.
    authority: canonical
    status: implemented
    path: harness/observation_bridge.py
    evidence:
      - tests/test_observation_bridge.py

  - id: ocr_semantics
    kind: code
    responsibility: Assembles OCR phrases and explicitly grounds exact targets without fabricating detector confidence.
    authority: canonical
    status: implemented
    path: harness/ocr_semantics.py
    evidence:
      - tests/test_ocr_semantics.py

  - id: city_world_visual_detector
    kind: perception
    responsibility: Produce current-frame semantic/layout evidence sufficient to distinguish CITY_VIEW and WORLD_MAP_VIEW from real pixels while suppressing foreground gather surfaces.
    authority: canonical
    status: partial
    path: harness/main_view_detector.py
    evidence:
      - tests/test_main_view_detector.py
    blocker: B001

  - id: main_view_training_profile
    kind: evidence
    responsibility: Hold operator-labelled real CITY_VIEW/WORLD_MAP_VIEW visual prototypes and calibrated acceptance thresholds.
    authority: evidence
    status: blocked
    path: config/main_view_profiles.json
    blocker: B001

  - id: resource_level_control
    kind: actuator
    responsibility: Ground and actuate an explicitly trained discrete resource-level control, carrying a typed visible postcondition contract.
    authority: canonical
    status: partial
    path: harness/resource_level_control.py
    evidence:
      - tests/test_resource_level_control.py
      - tests/test_typed_action_contracts.py
    blocker: B002

  - id: resource_level_training_profile
    kind: evidence
    responsibility: Hold real search-panel slider geometry, visible level range, mode and anchor calibration supplied from operator training.
    authority: evidence
    status: blocked
    path: config/resource_level_profile.json
    blocker: B002

  - id: state_classifier
    kind: code
    responsibility: Classifies only trained GATHER states from current-frame semantic evidence; otherwise fails closed.
    authority: canonical
    status: implemented
    path: harness/state_classifier.py
    evidence:
      - tests/test_state_classifier.py

  - id: gather_fact_extractor
    kind: code
    responsibility: Extracts bounded GATHER facts such as march queue usage, visible selected resource level and character identity.
    authority: canonical
    status: implemented
    path: harness/gather_facts.py
    evidence:
      - tests/test_gather_facts.py

  - id: troop_selection_policy
    kind: policy
    responsibility: Binds only an explicit positive operator approval to the exact mission/task/run/character occurrence and exposes the compiled troop-selection precondition without choosing commanders or composition.
    authority: canonical
    status: implemented
    path: harness/troop_policy.py
    evidence:
      - tests/test_troop_policy.py

  - id: troop_selection_policy_approval
    kind: evidence
    responsibility: Hold the explicit operator decision approving the currently visible troop/commander selection for one exact GATHER occurrence.
    authority: operator
    status: blocked
    blocker: B003

  - id: policy_overlay
    kind: code
    responsibility: Injects only explicit operator-approved gameplay precondition evidence.
    authority: canonical
    status: implemented
    path: harness/policy_overlay.py
    evidence:
      - tests/test_policy_overlay.py
      - tests/test_troop_policy.py

  - id: state_adapter
    kind: adapter
    responsibility: Converts metadata-rich classification and scene evidence into MissionTool snapshots.
    authority: canonical
    status: implemented
    path: harness/state_adapter.py
    evidence:
      - tests/test_state_adapter.py

  - id: deterministic_selector
    kind: code
    responsibility: Resolves zero/one/many eligible actions without model use on deterministic states.
    authority: canonical
    status: implemented
    path: harness/mission_selector.py
    evidence:
      - tests/test_mission_selector.py

  - id: mission_engine
    kind: code
    responsibility: Executes one declared transition and promotes dispatch to verified only from fresh state and typed postcondition evidence.
    authority: canonical
    status: implemented
    path: harness/mission_engine.py
    evidence:
      - tests/test_mission_engine.py
      - tests/test_gather_runtime_contracts.py
      - tests/test_typed_action_contracts.py

  - id: bounded_mission_tool
    kind: code
    responsibility: Bridges observation/classification to bounded semantic action dispatch, arguments and typed receipts.
    authority: canonical
    status: implemented
    path: harness/mission_tool.py
    evidence:
      - tests/test_mission_tool.py

  - id: semantic_action_surface
    kind: code
    responsibility: Resolves semantic actions via trained shortcuts or current-frame visual targets while preserving authorized unscored-exact OCR semantics.
    authority: canonical
    status: implemented
    path: harness/action_surface.py
    evidence:
      - tests/test_action_surface.py
      - tests/test_ocr_semantics.py

  - id: screen_mapping
    kind: adapter
    responsibility: Maps frame/client target geometry into screen coordinates while preserving frame provenance.
    authority: canonical
    status: implemented
    path: harness/screen_mapped_surface.py
    evidence:
      - tests/test_screen_mapped_surface.py

  - id: interference_guard
    kind: safety
    responsibility: Fails closed unless the expected ROK HWND/PID/foreground/geometry binding is safe for live input.
    authority: canonical
    status: implemented
    path: harness/windows_interference_guard.py
    evidence:
      - tests/test_windows_interference_guard.py

  - id: windows_input
    kind: actuator
    responsibility: Emits ordinary Win32 mouse/keyboard input only after the guard authorizes actuation.
    authority: canonical
    status: implemented
    path: harness/windows_input.py
    evidence:
      - tests/test_windows_input.py

  - id: post_action_verification
    kind: verification
    responsibility: Requires a fresh post-action frame, expected transition and typed completion or control evidence.
    authority: canonical
    status: implemented
    path: harness/mission_engine.py
    evidence:
      - tests/test_mission_engine.py
      - tests/test_mission_tool.py
      - tests/test_typed_action_contracts.py

  - id: mission_store
    kind: persistence
    responsibility: Persists mission occurrence identity, revision and verified self-loop checkpoint state atomically.
    authority: canonical
    status: implemented
    path: harness/mission_store.py
    evidence:
      - tests/test_mission_store.py
      - tests/test_mission_runner.py

  - id: mission_runner
    kind: orchestration
    responsibility: Runs one caller-driven deterministic mission tick and resumes from durable checkpoint state.
    authority: canonical
    status: implemented
    path: harness/mission_runner.py
    evidence:
      - tests/test_mission_runner.py

  - id: gather_cli
    kind: composition
    responsibility: Composes live observation, OCR semantics, trained visual evidence, typed level control, facts, occurrence-bound policy, guarded input, checkpoint store and append-only runtime evidence for one GATHER tick.
    authority: canonical
    status: implemented
    path: scripts/run_gather_tick.py
    evidence:
      - .github/workflows/gather-harness.yml
      - tests/test_troop_policy.py
      - tests/test_gather_replay_evidence.py

  - id: gather_runtime_evidence
    kind: verification
    responsibility: Records each canonical GATHER tick append-only and deterministically validates that real completion has live arming, trained profiles, occurrence-bound policy, fresh VERIFIED receipt and same-character march queue increase.
    authority: canonical
    status: implemented
    path: harness/gather_replay_evidence.py
    evidence:
      - tests/test_gather_replay_evidence.py
      - scripts/validate_gather_replay.py

  - id: live_replay_evidence
    kind: evidence
    responsibility: Prove the composed vertical slice against real captured game frames and guarded live actuation using the canonical replay evidence validator.
    authority: evidence
    status: blocked
    blocker: B004

edges:
  - {from: mission_contract, to: mission_compiler, relation: compiles_into}
  - {from: mission_compiler, to: deterministic_selector, relation: constrains}
  - {from: mission_compiler, to: mission_engine, relation: constrains}
  - {from: mission_contract, to: troop_selection_policy, relation: declares_precondition}
  - {from: live_capture, to: windows_ocr, relation: feeds}
  - {from: live_capture, to: observation_projection, relation: proves_frame}
  - {from: live_capture, to: city_world_visual_detector, relation: supplies_current_frame}
  - {from: windows_ocr, to: observation_projection, relation: feeds}
  - {from: observation_projection, to: ocr_semantics, relation: feeds}
  - {from: observation_projection, to: city_world_visual_detector, relation: supplies_frame_provenance}
  - {from: ocr_semantics, to: state_classifier, relation: feeds}
  - {from: ocr_semantics, to: gather_fact_extractor, relation: feeds}
  - {from: ocr_semantics, to: resource_level_control, relation: supplies_current_anchors}
  - {from: main_view_training_profile, to: city_world_visual_detector, relation: calibrates}
  - {from: city_world_visual_detector, to: state_classifier, relation: feeds}
  - {from: resource_level_training_profile, to: resource_level_control, relation: calibrates}
  - {from: resource_level_control, to: state_adapter, relation: grounds_typed_target}
  - {from: resource_level_control, to: semantic_action_surface, relation: resolves_typed_control}
  - {from: resource_level_control, to: mission_engine, relation: exposes_typed_postcondition_contract}
  - {from: gather_fact_extractor, to: troop_selection_policy, relation: supplies_character_scope}
  - {from: gather_fact_extractor, to: mission_engine, relation: supplies_visible_postcondition_fact}
  - {from: troop_selection_policy_approval, to: troop_selection_policy, relation: explicitly_authorizes}
  - {from: troop_selection_policy, to: policy_overlay, relation: supplies_bounded_approval}
  - {from: policy_overlay, to: state_adapter, relation: feeds}
  - {from: state_classifier, to: state_adapter, relation: feeds}
  - {from: state_adapter, to: deterministic_selector, relation: exposes_actions}
  - {from: deterministic_selector, to: mission_engine, relation: selects_for}
  - {from: state_adapter, to: bounded_mission_tool, relation: snapshots}
  - {from: mission_engine, to: bounded_mission_tool, relation: executes_through}
  - {from: bounded_mission_tool, to: semantic_action_surface, relation: dispatches_to}
  - {from: semantic_action_surface, to: screen_mapping, relation: resolves_through}
  - {from: resource_level_control, to: screen_mapping, relation: typed_screen_point}
  - {from: screen_mapping, to: interference_guard, relation: guarded_by}
  - {from: interference_guard, to: windows_input, relation: authorizes}
  - {from: windows_input, to: post_action_verification, relation: requires_fresh_verify}
  - {from: post_action_verification, to: mission_engine, relation: verifies}
  - {from: mission_engine, to: mission_store, relation: checkpoints}
  - {from: mission_store, to: mission_runner, relation: resumes}
  - {from: mission_engine, to: mission_runner, relation: driven_by}
  - {from: mission_runner, to: gather_cli, relation: composed_by}
  - {from: gather_cli, to: gather_runtime_evidence, relation: emits}
  - {from: troop_selection_policy_approval, to: live_replay_evidence, relation: supplies_policy_provenance}
  - {from: gather_runtime_evidence, to: live_replay_evidence, relation: validates}

blockers:
  - id: B001
    title: Main-view detector code exists but real CITY/WORLD calibration evidence is missing
    class: perception_data
    blocks: [city_world_visual_detector, main_view_training_profile, live_replay_evidence]
    falsification: At least two labelled real CITY_VIEW and two WORLD_MAP_VIEW client frames train the profile, held-out real fixtures classify deterministically, and foreground gather surfaces suppress main-view output.

  - id: B002
    title: Typed resource-level control exists but real slider geometry/range calibration is missing
    class: interaction_training
    blocks: [resource_level_control, resource_level_training_profile, live_replay_evidence]
    falsification: A real RESOURCE_SEARCH_PANEL trains horizontal slider bounds/range, guarded input sets a requested level, and a fresh visible selected_search_level fact equals the requested resource_level.

  - id: B003
    title: Occurrence-bound troop/commander approval evidence is missing
    class: gameplay_policy_evidence
    blocks: [troop_selection_policy_approval, live_replay_evidence]
    falsification: Operator supplies an explicit positive approval bound to the exact GATHER mission/task/run/character occurrence, and runtime evidence records the same approval on the completion transition.

  - id: B004
    title: End-to-end live evidence missing
    class: live_verification
    blocks: [live_replay_evidence]
    falsification: Canonical replay evidence validator PASSes a guarded one-character GATHER_RESOURCE run with live arming, trained B001/B002 profiles, occurrence-bound B003 approval, fresh VERIFIED receipt and durable same-character march queue increase.

coverage:
  active_vertical_slice: GATHER_RESOURCE
  dimensions:
    mission_contract: covered
    deterministic_selection: covered
    persistence_resume: covered
    action_dispatch_receipt: covered
    host_input_guard: covered
    post_action_verification: covered
    windows_capture: covered
    windows_ocr_bridge: covered
    ocr_target_grounding: covered
    gather_queue_fact: covered
    selected_resource_level_fact: covered
    main_view_visual_perception: partial
    main_view_profile_training: missing
    resource_level_actuation: partial
    resource_level_profile_training: missing
    commander_troop_policy: partial
    commander_troop_policy_contract: covered
    commander_troop_policy_approval: missing
    runtime_replay_evidence_contract: covered
    real_live_replay: missing
  other_mission_branches:
    CLAIM_ALLIANCE_TERRITORY_RSS: not_covered_end_to_end
    SWITCH_CHARACTER: not_covered_end_to_end
    BARBARIAN_FORT_RALLY: training_only
    EVENT_COORDINATION: not_covered_end_to_end
    GPT_OSS_DECISION_PROVIDER: deferred
    MISSION_SCHEDULER: deferred
