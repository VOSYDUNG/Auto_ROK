schema_version: 1
graph_id: AUTO_ROK_GATHER_VERTICAL_SLICE
updated_at: "2026-09-19"

principles:
  - deterministic_first
  - fresh_observation_before_verification
  - dispatch_is_not_success
  - unknown_gameplay_policy_is_needs_decision
  - one_canonical_authority_per_responsibility
  - agent_packages_are_subgraphs_not_file_lists

roots:
  - mission_contract
  - live_capture
  - mission_timeline

required_runtime_path:
  - mission_contract
  - mission_timeline
  - mission_knowledge_store
  - mission_scheduler
  - mission_compiler
  - live_capture
  - windows_ocr
  - observation_projection
  - ocr_semantics
  - city_world_visual_detector
  - resource_level_control
  - state_classifier
  - gather_fact_extractor
  - troop_selection_policy
  - policy_overlay
  - state_adapter
  - deterministic_selector
  - mission_engine
  - bounded_mission_tool
  - semantic_action_surface
  - screen_mapping
  - interference_guard
  - windows_input
  - post_action_verification
  - mission_store
  - mission_runner
  - gather_cli
  - gather_runtime_evidence

nodes:
  - id: mission_layer_config
    kind: config
    responsibility: Declares data-driven mission/task cadences, reset boundary, risk and local-LLM ownership policy.
    authority: canonical
    status: implemented
    path: config/mission_layer.yaml
    evidence:
      - tests/test_mission_timeline.py
      - docs/MISSION_LAYER_DESIGN.md

  - id: mission_timeline
    kind: orchestration
    responsibility: Derives daily, interval, event-window and continuous task signals from fresh semantic facts without fixed sleeps.
    authority: canonical
    status: implemented
    path: harness/mission_timeline.py
    evidence:
      - tests/test_mission_timeline.py
      - scripts/run_mission_layer_acceptance.py
      - workspace/evidence/mission_layer/acceptance-latest.json

  - id: mission_knowledge_store
    kind: persistence
    responsibility: Stores time-bounded semantic facts, task occurrences, change signals and evidence references in a local SQLite database.
    authority: canonical
    status: implemented
    path: harness/mission_knowledge.py
    evidence:
      - tests/test_mission_knowledge.py
      - scripts/run_mission_layer_acceptance.py
      - docs/MISSION_LAYER_DESIGN.md

  - id: mission_scheduler
    kind: orchestration
    responsibility: Runs a caller-driven no-input timeline tick, persists semantic facts and emits bounded decision packets only for unknown or ambiguous signals.
    authority: canonical
    status: implemented
    path: harness/mission_scheduler.py
    evidence:
      - tests/test_mission_scheduler.py
      - docs/MISSION_LAYER_DESIGN.md

  - id: mission_layer_acceptance
    kind: verification
    responsibility: Runs five non-interactive acceptance cases for reset, event windows, farm timing, queue/cooldown and retraining feedback.
    authority: evidence
    status: implemented
    path: scripts/run_mission_layer_acceptance.py
    evidence:
      - workspace/evidence/mission_layer/acceptance-latest.json
      - tests/test_mission_timeline.py
      - tests/test_mission_knowledge.py

  - id: mission_live_pass_observation
    kind: evidence
    responsibility: Records one current-screen deterministic observation pass with no gameplay input, semantic facts, unknowns and no-gem policy.
    authority: evidence
    status: implemented
    path: workspace/evidence/mission_layer/live-pass-20260919-01-report.json
    evidence:
      - workspace/evidence/mission_layer/live-pass-20260919-01.json
      - workspace/runs/mission-pass-20260919-01/scene.json
      - workspace/runs/mission-pass-20260919-03/scene.json
      - workspace/runs/mission-pass-20260919-04/scene.json
      - workspace/runs/mission-pass-20260919-05/scene.json
      - workspace/evidence/mission_layer/live-pass-20260919-01.sqlite3

