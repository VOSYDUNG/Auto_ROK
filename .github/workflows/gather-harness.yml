name: gather-harness

on:
  pull_request:
    paths:
      - "harness/**"
      - "scripts/run_gather_tick.py"
      - "scripts/windows_ocr.ps1"
      - "scripts/train_main_view_profiles.py"
      - "scripts/train_resource_level_profile.py"
      - "config/mission_flows.yaml"
      - "config/ui_states.yaml"
      - "config/gather_ocr_targets.json"
      - "config/main_view_profiles.json"
      - "config/resource_level_profile.json"
      - "config/engineering_graph.yaml"
      - "tests/test_mission_*.py"
      - "tests/test_state_*.py"
      - "tests/test_gather_facts.py"
      - "tests/test_gather_runtime_contracts.py"
      - "tests/test_observation_bridge.py"
      - "tests/test_ocr_semantics.py"
      - "tests/test_action_surface.py"
      - "tests/test_screen_mapped_surface.py"
      - "tests/test_windows_input.py"
      - "tests/test_windows_interference_guard.py"
      - "tests/test_policy_overlay.py"
      - "tests/test_main_view_detector.py"
      - "tests/test_resource_level_control.py"
      - "tests/test_typed_action_contracts.py"
      - ".github/workflows/gather-harness.yml"
  push:
    branches:
      - agentic-harness-v1
      - gpt-gather-03

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: python -m pip install --upgrade pytest PyYAML
      - name: Validate engineering graph
        run: python scripts/validate_engineering_graph.py
      - name: Run deterministic gather harness tests
        run: >-
          python -m pytest -q
          tests/test_mission_loader.py
          tests/test_state_classifier.py
          tests/test_state_adapter.py
          tests/test_mission_engine.py
          tests/test_mission_tool.py
          tests/test_mission_selector.py
          tests/test_mission_store.py
          tests/test_gather_facts.py
          tests/test_mission_runner.py
          tests/test_gather_runtime_contracts.py
          tests/test_observation_bridge.py
          tests/test_ocr_semantics.py
          tests/test_action_surface.py
          tests/test_screen_mapped_surface.py
          tests/test_windows_input.py
          tests/test_windows_interference_guard.py
          tests/test_policy_overlay.py
          tests/test_main_view_detector.py
          tests/test_resource_level_control.py
          tests/test_typed_action_contracts.py
      - name: Verify live-tick composition imports without Win32 side effects
        run: python -c "import scripts.run_gather_tick"
