name: alliance-claim

on:
  pull_request:
    paths:
      - "harness/alliance_state_classifier.py"
      - "harness/main_view_detector.py"
      - "scripts/run_alliance_claim_tick.py"
      - "config/alliance_ocr_targets.json"
      - "config/mission_flows.yaml"
      - "config/ui_states.yaml"
      - "config/engineering_graph.yaml"
      - "tests/test_alliance_*.py"
      - ".github/workflows/alliance-claim.yml"
  push:
    branches:
      - gpt-alliance-01

jobs:
  bounded-alliance-claim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest PyYAML
      - name: Validate engineering graph
        run: python scripts/validate_engineering_graph.py
      - name: Run alliance branch and shared-runtime tests
        run: >-
          python -m pytest -q
          tests/test_alliance_mission_loader.py
          tests/test_alliance_state_classifier.py
          tests/test_alliance_main_view_suppression.py
          tests/test_alliance_runtime_contracts.py
          tests/test_main_view_detector.py
          tests/test_mission_loader.py
          tests/test_state_adapter.py
          tests/test_mission_engine.py
          tests/test_mission_tool.py
          tests/test_mission_selector.py
          tests/test_mission_store.py
          tests/test_mission_runner.py
          tests/test_observation_bridge.py
          tests/test_ocr_semantics.py
          tests/test_action_surface.py
          tests/test_screen_mapped_surface.py
          tests/test_windows_input.py
          tests/test_windows_interference_guard.py
      - name: Verify alliance live-tick composition imports without Win32 side effects
        run: python -c "import scripts.run_alliance_claim_tick"
