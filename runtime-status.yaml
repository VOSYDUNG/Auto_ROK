    With QueueIndicatorObservationProvider wired into the live chain,
    successful MARCH completion should no longer accumulate
    "completion evidence is insufficient".
  expected_observation: >
    A fresh bounded occurrence ends from verified queue increase /
    stop-when-queue instead of exhausting max-ticks.
  baseline_measurement: >
