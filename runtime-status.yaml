    implementation_commit: fe33d912ca5dbb30e68c84ade8b2090122994f1d
    live_proof_after_commit: false
    evidence:
      - tests/test_live_tick_wiring.py
      - note: >
          Chain order extracted from the run_gather_tick AST places the
          provider at line 318, ahead of GatherFactObservationProvider at 335,
          which consumes its evidence. Replaying live-captured frames through
          that real pair yields march_queue_used=5, march_queue_capacity=5,
          march_queue_source=visible_ocr_march_queue_region - a value the
          completion predicate accepts.
    limitations:
      - consumption shown on replayed frames, not on a fresh runtime pass

  windows_direct_default:
    status: WIRED
    implementation_commit: fe33d912ca5dbb30e68c84ade8b2090122994f1d
    live_proof_after_commit: false
    evidence:
      - tests/test_live_tick_wiring.py::test_the_live_ocr_backend_is_the_in_process_one

  settle_after_action:
    status: WIRED
    implementation_commit: fe33d912ca5dbb30e68c84ade8b2090122994f1d
    live_proof_after_commit: false
    limitations:
