# Current runtime truth for Auto_ROK.
#
# This file is committed so the real state is visible on GitHub while heavy
# raw evidence (frames, recon dumps, isolation traces) stays under the
# gitignored workspace/. It is not a framework and not a database.
#
# It records what has been VERIFIED, never what is intended. Intent lives in
# docs/GOAL.md, docs/PRD.md, docs/BUILD_PLAN.md and
# config/engineering_graph.yaml, none of which are evidence of runtime
# behaviour. The status vocabulary and its invariants are defined in
# AGENTS.md under "Completion status levels".
#
# Evidence paths below are LOCAL ONLY - workspace/ is gitignored, so a clone
# will not contain them. Hashes are recorded so a local copy can be checked
# against what was actually observed.
