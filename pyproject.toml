[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autorok"
version = "0.1.0"
description = "A local LLM operating one Rise of Kingdoms client through a deterministic harness"
requires-python = ">=3.12"
dependencies = [
    "PyYAML==6.0.3",
]

# Windows capture and CPU vision are only needed to run against a live client.
# The mission layer, the evidence contracts and the whole test suite work
# without them, which is what keeps the suite runnable in under ten seconds.
[project.optional-dependencies]
observation = [
    "windows-capture==2.0.1",
    "numpy==2.5.3",
    "opencv-python==5.0.0.93",
    # Call Windows.Media.Ocr from Python instead of shelling out to
    # PowerShell. Same engine; 93 ms instead of 1,036 ms, because the process
    # boundary forced re-hashing and re-decoding a frame Python already held.
    "winrt-runtime==3.2.1",
    "winrt-Windows.Media.Ocr==3.2.1",
    "winrt-Windows.Graphics.Imaging==3.2.1",
    "winrt-Windows.Storage.Streams==3.2.1",
    "winrt-Windows.Foundation==3.2.1",
    "winrt-Windows.Foundation.Collections==3.2.1",
    "winrt-Windows.Globalization==3.2.1",
]
cpu-ocr = [
    "rapidocr-onnxruntime==1.4.4",
    "onnxruntime==1.30.0",
]
dev = ["pytest>=8"]

[tool.setuptools]
# Four top-level packages, per docs/PROJECT_DECLARATION.md section 2:
# harness is the 80% mechanism, autorok holds the rewritten work process,
# knowledge is the game facts, operator_layer the account profiles.
packages = ["autorok", "autorok.llm", "autorok.mission", "harness", "knowledge", "operator_layer"]

[tool.pytest.ini_options]
# Before this file existed the suite only worked through `python -m pytest`,
# which happens to put the working directory on sys.path. Typing `pytest`
# directly failed to import harness, and running from any other directory
# failed outright. pythonpath fixes both without asking anyone to install
# the project first.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
